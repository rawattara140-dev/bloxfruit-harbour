<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store: Bloxfruit Harbour</title>
<meta name="theme-color" content="#0a0c16">
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-page="store">
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header" class="site-header"></header>

<main id="main" class="page">
  <div class="container">
    <div class="page-head">
      <h1>Fruit store</h1>
      <p>Prices are in Nepalese rupees (Rs.). Stock is limited and shown honestly: a fruit that says OUT OF STOCK cannot be ordered.</p>
    </div>
    <p class="callout" id="pay-note" hidden></p>

    <form id="s-filters" class="toolbar" role="search">
      <input class="search" id="s-q" type="search" placeholder="Search fruits" aria-label="Search the store">
      <select id="s-category" aria-label="Category"><option value="">All categories</option></select>
      <label class="check"><input type="checkbox" id="s-instock"> In stock only</label>
    </form>
    <p id="s-count" class="result-count" aria-live="polite"></p>
    <div id="s-grid" class="grid-cards"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>

    <section class="section" id="orders-section" aria-labelledby="orders-h" hidden>
      <div class="section-head"><div><h2 id="orders-h">My orders</h2><p>Unpaid orders keep your fruit reserved. Cancel one to release it.</p></div></div>
      <div id="orders-list" class="listing-stack"></div>
    </section>
  </div>
</main>

<dialog id="buy-dialog" class="dialog" aria-labelledby="buy-title">
  <form class="dialog-inner" id="buy-form" novalidate>
    <div class="dialog-head"><h2 id="buy-title">Buy</h2><button class="icon-btn" type="button" id="buy-close" aria-label="Close">&times;</button></div>
    <div id="buy-form-body">
      <div class="buy-summary" id="buy-summary"></div>
      <div class="form-row">
        <div class="field"><label for="buy-qty">Quantity</label><input id="buy-qty" type="number" min="1" step="1" value="1"><span class="field-hint" id="buy-max"></span></div>
        <div class="field"><label for="buy-roblox">Your Roblox username</label><input id="buy-roblox" maxlength="20" autocomplete="off" autocapitalize="none" spellcheck="false"><span class="field-hint">Where we deliver the fruit.</span></div>
      </div>
      <div class="field"><label for="buy-note">Note (optional)</label><input id="buy-note" maxlength="200"></div>
      <p class="buy-total">Total <strong id="buy-total">Rs. 0</strong></p>
      <p class="form-error" id="buy-error" role="alert"></p>
      <div class="dialog-actions"><button class="btn" type="submit" id="buy-submit">Place order</button></div>
    </div>
    <div id="buy-result" hidden></div>
  </form>
</dialog>

<footer id="site-footer" class="site-footer"></footer>
<script src="/js/app.js" defer></script>
<script src="/js/store.js" defer></script>
</body>
</html>
